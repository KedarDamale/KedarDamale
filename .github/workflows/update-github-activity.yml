name: Update GitHub activity graph

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/generate-github-activity.mjs'
      - 'scripts/generate-profile-assets.mjs'
      - 'scripts/profile-theme.mjs'
      - 'scripts/profile-stats.mjs'
      - 'scripts/vendor/**'
      - 'tests/profile-activity.test.mjs'
      - '.github/workflows/update-github-activity.yml'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: false

jobs:
  update-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check contribution rendering
        run: node --test tests/profile-activity.test.mjs

      - name: Generate profile artwork
        run: node scripts/generate-profile-assets.mjs

      - name: Generate the rolling five-month graph
        env:
          GITHUB_USERNAME: KedarDamale
          # Set PROFILE_ACTIVITY_TOKEN to a personal access token with the
          # "read:user" scope to include private contribution counts.
          PROFILE_ACTIVITY_TOKEN: ${{ secrets.PROFILE_ACTIVITY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generate-github-activity.mjs

      - name: Commit changed graphics
        run: |
          git config user.name 'Kedar Damale'
          git config user.email 'damalekedar@gmail.com'
          git add assets/profile/ assets/github-activity.svg assets/github-stats.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh profile graphics'
          git push
