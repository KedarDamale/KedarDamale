name: Build and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_resume:
        description: Rebuild the resume even when its source is unchanged
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect resume changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIOUS_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          FORCE_REBUILD: ${{ inputs.rebuild_resume }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$FORCE_REBUILD" == "true" ]]; then
            echo "resume_changed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" ]] && ! git diff --quiet "$PREVIOUS_SHA" "$CURRENT_SHA" -- resume/; then
            echo "resume_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "resume_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Synchronize with the latest main branch
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Compile LaTeX resume
        if: steps.changes.outputs.resume_changed == 'true'
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: resume
      - name: Publish the versioned portfolio resume
        if: steps.changes.outputs.resume_changed == 'true'
        run: |
          version="$(date -u +%Y%m%dT%H%M%SZ)-run${{ github.run_number }}"
          bash scripts/publish-resume.sh resume/main.pdf "$version"
          echo "RESUME_FILE=resume-$version.pdf" >> "$GITHUB_ENV"
      - name: Refresh the portfolio resume link
        run: |
          latest_resume="$(find portfolio -maxdepth 1 -type f -name 'resume-*.pdf' -printf '%f\n' | sort | tail -n 1)"
          if [[ -n "$latest_resume" ]]; then
            sed -E -i "s/href=\"resume(-[A-Za-z0-9._-]+)?\\.pdf\"/href=\"$latest_resume\"/g" portfolio/index.html
          fi
      - name: Commit portfolio resume updates
        env:
          RESUME_CHANGED: ${{ steps.changes.outputs.resume_changed }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/index.html
          if [[ "$RESUME_CHANGED" == "true" ]]; then
            git add "portfolio/$RESUME_FILE"
          fi
          if git diff --cached --quiet; then
            echo "Portfolio resume links are already current"
          else
            if [[ "$RESUME_CHANGED" == "true" ]]; then
              git commit -m "chore: publish $RESUME_FILE"
            else
              git commit -m "chore: refresh portfolio resume link"
            fi
            git push || {
              if ! git pull --rebase origin main || ! git push; then
                git rebase --abort || true
                echo "::warning::The generated resume could not be committed because main changed during this run. Publishing the current build anyway."
              fi
            }
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio
      - id: deployment
        uses: actions/deploy-pages@v4
